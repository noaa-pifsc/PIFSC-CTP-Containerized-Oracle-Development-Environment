services:
  code-db-ords-deploy:
    secrets:
      - ctp_user
      - ctp_pwd
      - ctp_app_user
      - ctp_app_pwd
      - ctp_apx_user
      - ctp_apx_pwd
secrets:
  ctp_user:
    name: ${COMPOSE_PROJECT_NAME}_ctp_user
    external: true
  ctp_pwd:
    name: ${COMPOSE_PROJECT_NAME}_ctp_pwd
    external: true
  ctp_app_user:
    name: ${COMPOSE_PROJECT_NAME}_ctp_app_user
    external: true
  ctp_app_pwd:
    name: ${COMPOSE_PROJECT_NAME}_ctp_app_pwd
    external: true
  ctp_apx_user:
    name: ${COMPOSE_PROJECT_NAME}_ctp_apx_user
    external: true
  ctp_apx_pwd:
    name: ${COMPOSE_PROJECT_NAME}_ctp_apx_pwd
    external: true    